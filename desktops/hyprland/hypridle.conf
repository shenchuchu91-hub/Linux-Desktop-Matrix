# ==============================================================================
#  💤 Hypridle 待机与锁屏守护进程配置 (hypridle.conf)
#  项目: Linux-Desktop-Matrix
#  维护: shenchuchu91-hub
# ==============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock       # 避免重复拉起多个锁屏实例
    before_sleep_cmd = loginctl lock-session    # 睡眠前自动上锁
    after_sleep_cmd = hyprctl dispatch dpms on  # 唤醒后自动点亮屏幕
}

# 3 分钟闲置：降低屏幕背光
listener {
    timeout = 180
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 5 分钟闲置：自动锁屏
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 10 分钟闲置：关闭显示器电源 (DPMS)
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 30 分钟闲置：系统休眠 (挂起)
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}

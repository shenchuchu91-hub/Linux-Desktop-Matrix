# ==============================================================================
#  🔒 Hyprlock 现代化 Wayland 锁屏界面配置 (hyprlock.conf)
#  项目: Linux-Desktop-Matrix
#  维护: shenchuchu91-hub
# ==============================================================================

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# 时钟组件
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba(243, 139, 168, 1.0)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 120
    halign = center
    valign = center
}

# 日期组件
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %B %d, %Y')"
    color = rgba(205, 214, 244, 0.85)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

# 密码输入框
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(243, 139, 168, 1.0)
    inner_color = rgba(30, 30, 46, 0.75)
    font_color = rgb(205, 214, 244)
    fade_on_empty = false
    placeholder_text = <span foreground="##cdd6f4">输入密码以解锁...</span>
    hide_input = false
    rounding = 15
    check_color = rgb(166, 227, 161)
    fail_color = rgb(243, 139, 168)
    fail_text = <i>密码错误 ($ATTEMPTS)</i>
    position = 0, -60
    halign = center
    valign = center
}

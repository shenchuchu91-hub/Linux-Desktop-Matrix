# ==============================================================================
#  🌸 Hyprland 现代化流体平铺配置文件 (hyprland.conf)
#  项目: Linux-Desktop-Matrix
#  维护: shenchuchu91-hub
# ==============================================================================

# --- 显示器与分辨率配置 (Monitor Setup) ---
# 默认适配主显示器，高刷新率优先匹配 144Hz，兼顾通用屏幕
monitor = , preferred, auto, 1

# --- 混合双显卡与驱动兼容参数 (Hybrid GPU / NVIDIA Environment) ---
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

# NVIDIA 专属 Wayland 参数 (已通过双显卡环境验证)
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

# GTK & Qt 主题与输入法环境变量
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,gtk3
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XMODIFIERS,@im=fcitx
env = QT_IM_MODULE,fcitx
env = SDL_IM_MODULE,fcitx

# --- 默认常用应用绑定 ---
$terminal = foot
$fileManager = thunar
$menu = fuzzel
$browser = firefox

# --- 自启动守护进程 (Autostart) ---
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 || /usr/lib/polkit-kde-authentication-agent-1
exec-once = fcitx5 -d
exec-once = waybar -c ~/.config/waybar/config.jsonc -s ~/.config/waybar/style.css
exec-once = hypridle
exec-once = dunst || mako
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# --- 光标与输入设定 (Input & Cursor) ---
cursor {
    no_hardware_cursors = true
    default_monitor = 
}

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

# --- 桌面美学与外观间隙 (Appearance & Rice) ---
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # 二次元淡雅樱粉与夜空青渐变边框 (Sakura & Arch Blue)
    col.active_border = rgba(ffb6c1ee) rgba(89b4faee) 45deg
    col.inactive_border = rgba(313244aa)

    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 10

    active_opacity = 0.95
    inactive_opacity = 0.85
    fullscreen_opacity = 1.0

    # 双重 Kawase 高斯模糊
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
        vibrancy = 0.1696
    }

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

# --- 物理弹性动画系统 (Animations) ---
animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1

    animation = windows, 1, 4, easeOutQuint
    animation = windowsIn, 1, 4, easeOutQuint, popin 87%
    animation = windowsOut, 1, 3, easeInOutCubic, popin 87%
    animation = border, 1, 8, easeOutQuint
    animation = fade, 1, 3, easeOutQuint
    animation = workspaces, 1, 4, easeOutQuint, slide
}

# --- 布局逻辑 (Dwindle) ---
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

# --- 窗口规则 (Window Rules) ---
windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = float, class:^(satty)$
windowrulev2 = float, title:^(Friends List)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$

# --- 快捷键映射 (Keybindings) ---
$mainMod = SUPER

# 基础操作
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, F, fullscreen, 0

# 焦点移动 (Vim 键位与方向键)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u

# 工作区切换 (1 - 9)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# 移动活动窗口到指定工作区
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# 鼠标按键拖动与缩放窗口
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# 截图与锁屏
bind = , Print, exec, satty -f filename -
bind = $mainMod, L, exec, hyprlock

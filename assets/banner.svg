<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- 线性与径向渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11111b" />
      <stop offset="40%" stop-color="#181825" />
      <stop offset="100%" stop-color="#1e1e2e" />
    </linearGradient>

    <linearGradient id="sakuraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f38ba8" />
      <stop offset="50%" stop-color="#f5c2e7" />
      <stop offset="100%" stop-color="#cba6f7" />
    </linearGradient>

    <linearGradient id="archNixGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#89b4fa" />
      <stop offset="50%" stop-color="#89dceb" />
      <stop offset="100%" stop-color="#a6e3a1" />
    </linearGradient>

    <!-- 发光滤镜 -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatSakura {
        0% { transform: translateY(0px) rotate(0deg); opacity: 0.8; }
        50% { transform: translateY(-12px) rotate(15deg); opacity: 1; }
        100% { transform: translateY(0px) rotate(0deg); opacity: 0.8; }
      }
      @keyframes pulseGlow {
        0% { filter: drop-shadow(0 0 10px rgba(243, 139, 168, 0.4)); }
        50% { filter: drop-shadow(0 0 25px rgba(203, 166, 247, 0.8)); }
        100% { filter: drop-shadow(0 0 10px rgba(243, 139, 168, 0.4)); }
      }
      @keyframes starTwinkle {
        0% { opacity: 0.3; }
        50% { opacity: 0.9; }
        100% { opacity: 0.3; }
      }
      .star1 { animation: starTwinkle 3s infinite ease-in-out; }
      .star2 { animation: starTwinkle 4s infinite ease-in-out 1s; }
      .star3 { animation: starTwinkle 3.5s infinite ease-in-out 0.5s; }
      .floatingPetal { animation: floatSakura 6s infinite ease-in-out; }
      .glowingEmblem { animation: pulseGlow 4s infinite ease-in-out; }
    </style>
  </defs>

  <!-- 背景矩阵 -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" stroke="#313244" stroke-width="2"/>

  <!-- 背景科技网格线条 -->
  <g opacity="0.06" stroke="#cdd6f4" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="250" y1="0" x2="250" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="550" y1="0" x2="550" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="850" y1="0" x2="850" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="1150" y1="0" x2="1150" y2="420" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- 星光点缀 -->
  <circle cx="150" cy="80" r="1.5" fill="#f5c2e7" class="star1" />
  <circle cx="280" cy="50" r="2" fill="#89dceb" class="star2" />
  <circle cx="980" cy="70" r="2" fill="#f38ba8" class="star3" />
  <circle cx="1080" cy="130" r="1.5" fill="#a6e3a1" class="star1" />
  <circle cx="850" cy="340" r="2" fill="#cba6f7" class="star2" />
  <circle cx="180" cy="320" r="1.5" fill="#89b4fa" class="star3" />

  <!-- 飘落樱花瓣 (二次元美学) -->
  <g class="floatingPetal" fill="#f38ba8" opacity="0.75">
    <path d="M 220 90 C 225 80, 240 85, 235 95 C 230 105, 215 100, 220 90 Z" />
    <path d="M 1020 80 C 1025 70, 1040 75, 1035 85 C 1030 95, 1015 90, 1020 80 Z" />
    <path d="M 920 330 C 925 320, 940 325, 935 335 C 930 345, 915 340, 920 330 Z" />
    <path d="M 140 280 C 145 270, 160 275, 155 285 C 150 295, 135 290, 140 280 Z" />
  </g>

  <!-- 顶端小标签徽章 -->
  <g transform="translate(600, 65)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="#181825" stroke="#f38ba8" stroke-width="1.5" opacity="0.9"/>
    <text x="0" y="5" font-family="'JetBrainsMono Nerd Font', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="600" fill="#f5c2e7" text-anchor="middle" letter-spacing="2">
      ⛩️ UNIVERSAL LINUX DESKTOP MATRIX
    </text>
  </g>

  <!-- 主标题 (LINUX DESKTOP MATRIX) -->
  <g transform="translate(600, 145)" class="glowingEmblem">
    <text x="0" y="0" font-family="'JetBrainsMono Nerd Font', 'Segoe UI', sans-serif" font-size="44" font-weight="800" fill="url(#sakuraGrad)" text-anchor="middle" letter-spacing="3">
      LINUX DESKTOP MATRIX
    </text>
  </g>

  <!-- 副标题与说明 -->
  <text x="600" y="190" font-family="'Noto Sans CJK SC', 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#cdd6f4" text-anchor="middle" letter-spacing="1">
    跨发行版 Linux 桌面管理与平铺架构全景矩阵 · 交互式按需部署套件
  </text>
  <text x="600" y="222" font-family="'JetBrainsMono Nerd Font', 'Noto Sans CJK SC', sans-serif" font-size="14" font-weight="300" fill="#a6adc8" text-anchor="middle" letter-spacing="0.5">
    Niri (Shorin 大老师定制版 / 官方原版) · DMS · Hyprland · GNOME · NixOS Flake &amp; Home-Manager
  </text>

  <!-- 下方组件与发行版矩阵展示条 -->
  <g transform="translate(600, 310)">
    <!-- 矩形底卡 -->
    <rect x="-480" y="-45" width="960" height="90" rx="12" fill="#181825" stroke="#45475a" stroke-width="1.2" opacity="0.85"/>

    <!-- 模块 1: Niri Shorin vs Vanilla -->
    <g transform="translate(-360, 0)">
      <circle cx="0" cy="-8" r="16" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
      <text x="0" y="-3" font-family="'JetBrainsMono Nerd Font', sans-serif" font-size="13" font-weight="bold" fill="#f38ba8" text-anchor="middle">󱂬</text>
      <text x="0" y="18" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" font-weight="600" fill="#cdd6f4" text-anchor="middle">Niri 卷轴双版</text>
      <text x="0" y="32" font-family="'JetBrainsMono Nerd Font', sans-serif" font-size="10" fill="#6c7086" text-anchor="middle">Shorin / Vanilla</text>
    </g>

    <!-- 模块 2: DMS Shell -->
    <g transform="translate(-180, 0)">
      <circle cx="0" cy="-8" r="16" fill="#313244" stroke="#f5c2e7" stroke-width="1.5"/>
      <text x="0" y="-3" font-family="'JetBrainsMono Nerd Font', sans-serif" font-size="13" font-weight="bold" fill="#f5c2e7" text-anchor="middle">🌸</text>
      <text x="0" y="18" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" font-weight="600" fill="#cdd6f4" text-anchor="middle">DMS 外壳</text>
      <text x="0" y="32" font-family="'JetBrainsMono Nerd Font', sans-serif" font-size="10" fill="#6c7086" text-anchor="middle">Dank Miau Shell</text>
    </g>

    <!-- 模块 3: Hyprland -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="-8" r="16" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
      <text x="0" y="-3" font-family="'JetBrainsMono Nerd Font', sans-serif" font-size="13" font-weight="bold" fill="#89b4fa" text-anchor="middle"></text>
      <text x="0" y="18" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" font-weight="600" fill="#cdd6f4" text-anchor="middle">Hyprland</text>
      <text x="0" y="32" font-family="'JetBrainsMono Nerd Font', sans-serif" font-size="10" fill="#6c7086" text-anchor="middle">Dynamic Blur</text>
    </g>

    <!-- 模块 4: GNOME -->
    <g transform="translate(180, 0)">
      <circle cx="0" cy="-8" r="16" fill="#313244" stroke="#89dceb" stroke-width="1.5"/>
      <text x="0" y="-3" font-family="'JetBrainsMono Nerd Font', sans-serif" font-size="13" font-weight="bold" fill="#89dceb" text-anchor="middle"></text>
      <text x="0" y="18" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" font-weight="600" fill="#cdd6f4" text-anchor="middle">GNOME 现代</text>
      <text x="0" y="32" font-family="'JetBrainsMono Nerd Font', sans-serif" font-size="10" fill="#6c7086" text-anchor="middle">Wayland &amp; Dconf</text>
    </g>

    <!-- 模块 5: NixOS & Multi-Distro -->
    <g transform="translate(360, 0)">
      <circle cx="0" cy="-8" r="16" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
      <text x="0" y="-3" font-family="'JetBrainsMono Nerd Font', sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1" text-anchor="middle">❄️</text>
      <text x="0" y="18" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" font-weight="600" fill="#cdd6f4" text-anchor="middle">多发行版 / NixOS</text>
      <text x="0" y="32" font-family="'JetBrainsMono Nerd Font', sans-serif" font-size="10" fill="#6c7086" text-anchor="middle">Home-Manager</text>
    </g>
  </g>

  <!-- 底部署名与协议 -->
  <text x="600" y="390" font-family="'JetBrainsMono Nerd Font', sans-serif" font-size="12" fill="#6c7086" text-anchor="middle">
    Maintained with Rigor &amp; Craftsmanship by shenchuchu91-hub · Open Source under MIT
  </text>
</svg>
